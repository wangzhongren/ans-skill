ius:9px;padding:14px;text-align:left;min-height:130px;transition:background .2s,border .2s,box-shadow .2s;min-width:0}.stepnode.active{border-color:#198068;background:#eef8f1;box-shadow:0 0 0 3px #1c80661a;transform:translateY(-1px)}.stepnode.done{border-color:#99c5ad;background:#f9fdf9}.stepnum{font-size:10px;border-radius:50%;width:21px;height:21px;background:#edf3ec;display:inline-grid;place-items:center;color:#78917e;margin-right:7px}.stepnode.active .stepnum{background:var(--teal);color:white}.stepnode .layer{font-size:9px;color:#8a9d8e;letter-spacing:1px}.stepnode strong{display:block;font-size:13px;margin:9px 0 6px}.stepnode code{display:block;font:10px/1.5 ui-monospace,monospace;color:#7f9184;overflow-wrap:anywhere}.external{font-size:9px;color:#a87536;float:right}.controls{border-top:1px solid var(--line);padding:16px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fcfdfa}.btn{background:white;border:1px solid #d7e3d9;border-radius:6px;padding:7px 12px;color:var(--ink);font-size:12px;white-space:nowrap}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.progress{flex:1;height:4px;background:#e5eee4;border-radius:4px;overflow:hidden;min-width:45px;margin:0 10px}.progress span{display:block;height:100%;background:var(--teal);transition:width .2s}.counter{font:11px ui-monospace,monospace;color:var(--muted)}#speed{min-width:0;width:88px;padding:6px;font-size:11px}.inspector .title{padding:19px 19px 13px;border-bottom:1px solid var(--line)}.inspector .title span{font-size:9px;letter-spacing:1.8px;color:var(--teal)}.inspector .title h2{font-size:17px;margin:7px 0 0}.inspectorbody{padding:17px 19px}.inspector p{font-size:12px;color:#6c8074;margin:0 0 16px}.label{font-size:10px;color:#8b9b8e;margin:18px 0 7px;letter-spacing:1px}.state{display:grid;gap:7px}.stateitem{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;background:#f5f8f2;border-radius:5px;font-size:11px}.stateitem.changed{background:#e9f6e9;border-left:2px solid #5fab78}.stateitem span{color:#788b78}.stateitem strong{font-weight:600;overflow-wrap:anywhere;text-align:right;max-width:60%}.code{background:#f3f6f0;border:1px solid #e4eade;border-radius:6px;padding:11px;font:10px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#526b55}.sourcepath{font:10px/1.5 ui-monospace,monospace;color:#859581;overflow-wrap:anywhere;margin-bottom:7px}.caption{padding:0 20px 18px;font-size:11px;color:var(--muted)}.empty{padding:55px 22px;text-align:center;color:#829583;font-size:12px}.empty strong{display:block;font-size:15px;color:#4b6951;margin-bottom:8px}.overviewgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.rolecard{border:1px solid var(--line);background:#fff;border-radius:10px;padding:22px;text-align:left}.rolecard:hover{border-color:#72ae87}.rolecard strong{font-size:16px}.rolecard p{font-size:12px;color:var(--muted);min-height:40px}.rolecard small{color:var(--teal)}.layers{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:14px;padding:20px;min-width:1030px}.layercol{border-top:3px solid #97bfa2;padding-top:10px}.layercol h3{font-size:12px;margin:0 0 13px}.filenode{display:block;width:100%;padding:12px;background:white;border:1px solid #dfe7dc;border-radius:7px;margin-bottom:9px;text-align:left}.filenode.externalfile{border-style:dashed;background:#f9faf7}.filenode.selected{border-color:var(--teal);box-shadow:0 0 0 2px #2b815c19}.filenode strong{display:block;font-size:11px}.filenode small{font:9px/1.5 ui-monospace,monospace;color:#7c8e7c;display:block;overflow-wrap:anywhere}.fileinfo{padding:18px 20px;border-top:1px solid var(--line);font-size:12px;color:#6a806a}.relations{display:flex;flex-wrap:wrap;gap:7px}.relation{border:1px solid #dce7db;background:#f5f9f2;border-radius:5px;padding:5px 9px;font:10px ui-monospace,monospace;text-align:left;overflow-wrap:anywhere}.docs{padding:16px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.docs button{font-size:10px}.bottom{border-top:1px solid var(--line);padding-top:15px;margin-top:13px;color:#8a9a89;font-size:10px;display:flex;justify-content:space-between;gap:12px}.warn{color:#a86b2b;background:#fff3df;border:1px solid #ecdbb8;border-radius:6px;font-size:11px;padding:10px;margin-top:12px}dialog{border:1px solid var(--line);border-radius:11px;width:min(900px,92vw);max-height:85vh;padding:0;color:var(--ink);box-shadow:0 20px 80px #123c2e30}dialog::backdrop{background:#142e2b65;backdrop-filter:blur(3px)}.dialoghead{position:sticky;top:0;background:white;padding:18px 21px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;margin:0;font:12px/1.8 ui-monospace,monospace;background:#fafcf8}[hidden]{display:none!important}@media(max-width:1150px){.app{grid-template-columns:185px minmax(0,1fr)}.content{padding:25px 22px}.workspace{grid-template-columns:minmax(0,1fr) 250px;gap:14px}.inspectorbody{display:block}.flowgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.overviewgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:900px){.workspace{grid-template-columns:1fr}.inspectorbody{display:grid;grid-template-columns:1fr 1fr;gap:18px}}@media(max-width:750px){.app{display:block}.sidebar{height:auto;position:relative;padding:15px}.logo{margin:0 0 10px}.back{float:right;margin:0}.navcap,.sidebarfoot{display:none}#roles{display:flex;overflow:auto;gap:4px}.rolebtn{min-width:105px;width:auto;white-space:nowrap;margin:0;padding:8px 10px}.rolebtn small{display:none}.topbar{height:52px;padding:0 17px}.content{padding:24px 15px}h1{font-size:22px}.headstat{display:none}.bar{align-items:flex-start;flex-direction:column}.flowgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}.diagramwrap{padding:18px 13px}.stepnode{padding:11px}.inspectorbody{display:block}.controls{padding:13px}.progress{order:2;flex-basis:60%}.overviewgrid{grid-template-columns:1fr}.selector{padding:15px}.selectgroup{width:100%}select{width:100%}.head{margin-bottom:17px}}
body.embedded{background:transparent}body.embedded .app{display:block;min-height:0}body.embedded .sidebar,body.embedded .topbar,body.embedded .head{display:none}body.embedded .content{padding:0;max-width:none}body.embedded .bottom{padding:10px 2px}body.embedded dialog{max-height:600px}@media(min-width:700px){body.embedded .workspace{grid-template-columns:minmax(0,1fr) 250px;gap:14px}body.embedded .inspectorbody{display:block}body.embedded .flowgrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}</style></head><body>
<div class="app"><aside class="sidebar"><div class="logo"><span class="mark">A/N</span><b>ANS</b></div><a class="back" href="/">← 返回角色协作台</a><div class="navcap">角色与功能</div><div id="roles"></div><div class="sidebarfoot">边界文件限定角色视图<br>功能描述组织演示顺序<br>源码片段提供定位依据</div></aside><div class="shell"><header class="topbar"><span id="breadcrumb">正在加载角色图谱…</span><span class="modebadge">功能演示 · 不执行应用代码</span></header><main class="content">
<div class="head"><div><div class="eyebrow">ROLE FLOW EXPLORER</div><h1 id="title">从功能，看懂运行过程。</h1><p id="description" class="description">选择角色，按功能逐步探索。</p></div><div class="headstat" id="stats"></div></div>
<div class="notice" id="notice" hidden></div>
<div class="bar" id="modebar"><div class="tabs"><button class="tab active" id="flowTab">功能演示</button><button class="tab" id="overviewTab">角色总览</button></div><span class="small" id="freshness">等待数据</span></div>
<div id="projectView" class="overviewgrid" hidden></div>
<div id="flowView"><div class="panel"><div class="selector"><div class="selectgroup"><label for="functionSelect">选择功能</label><select id="functionSelect"></select></div><div class="selectgroup"><label for="scenarioSelect">演示场景</label><select id="scenarioSelect"></select></div><div class="explain" id="functionDescription"></div></div></div>
<div class="workspace"><section class="panel"><div class="stagehead"><h2>功能执行路径</h2><span class="hint">箭头表示编排顺序，不是实测调用链</span></div><div class="diagramwrap"><div class="flowgrid" id="flowGraph"></div></div><div class="controls"><button class="btn" id="reset">↺ 重置</button><button class="btn" id="previous">← 上一步</button><button class="btn primary" id="next">下一步 →</button><button class="btn" id="play">▶ 自动播放</button><select id="speed" aria-label="播放速度"><option value="1500">1.5 秒</option><option value="800">0.8 秒</option><option value="2500">2.5 秒</option></select><div class="progress"><span id="progress"></span></div><span class="counter" id="counter">00 / 00</span></div><p class="caption" id="flowCaption"></p></section><aside class="panel inspector"><div class="title"><span>STEP INSPECTOR</span><h2 id="stepTitle">准备开始</h2></div><div class="inspectorbody"><div><p id="stepDescription"></p><div class="label">示例状态 <span class="small">· 变化项高亮</span></div><div class="state" id="state"></div><div id="warning" class="warn" hidden></div></div><div><div class="label">源码依据</div><div class="sourcepath" id="sourcePath"></div><pre class="code" id="quote"></pre><button class="btn" id="sourceButton" style="margin-top:9px">查看源码上下文 ↗</button></div></div></aside></div></div>
<section class="panel" id="overviewView" hidden><div class="stagehead"><h2>角色文件与直接引用</h2><span class="hint">虚线卡片：外部角色节点</span></div><div style="overflow:auto"><div id="fileGraph" class="layers"></div></div><div class="fileinfo" id="fileInfo">点击文件查看直接引用与被引用关系。</div></section>
<section class="panel" id="documents"><div class="docs" id="docLinks"></div></section><footer class="bottom"><span>示例状态由声明式步骤驱动，不改变源码、调度状态或权限。</span><span id="generated"></span></footer>
</main></div></div>
<dialog id="sourceDialog"><div class="dialoghead"><strong id="dialogTitle"></strong><button class="btn" id="closeDialog">关闭 ×</button></div><pre id="dialogBody"></pre></dialog>
<script>
'use strict';
const embedded=new URLSearchParams(location.search).get('embedded')==='1';if(embedded)document.body.classList.add('embedded');
const $=id=>document.getElementById(id),labels={interface:'Interface · 接入',pipelines:'Pipeline · 编排',services:'Service · 业务',providers:'Provider · 外部能力',models:'Model · 共享模型',support:'入口 / 支持文件'};
let index=null,graph=null,selectedRole=null,mode='flow',functionIndex=0,scenarioIndex=0,position=-1,playTimer=null,pollTimer=null,loadingVersion=0,connectionLost=false;
const text=v=>v==null?'—':typeof v==='object'?JSON.stringify(v):String(v);
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=text(value);if(cls)n.className=cls;return n}
function scenario(){return graph?.functions?.[functionIndex]?.scenarios?.[scenarioIndex]||null}
function canPlay(){return !!scenario()&&graph?.freshness?.current&&!connectionLost}
function halt(){clearInterval(playTimer);playTimer=null;$('play').textContent='▶ 自动播放'}
function setNotice(message){$('notice').hidden=!message;$('notice').textContent=message||''}
async function api(path){const r=await fetch(path,{cache:'no-store',signal:AbortSignal.timeout(8000)});const d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
function roleNav(){if(embedded)window.parent.postMessage({type:'ans-role-atlas-selected',roleId:selectedRole},location.origin);const box=$('roles');box.replaceChildren();const all=el('button','◈ 项目总览','rolebtn'+(selectedRole===null?' active':''));all.onclick=projectOverview;box.append(all);for(const r of index.roles){const b=el('button',undefined,'rolebtn'+(selectedRole===r.id?' active':''));b.append(el('span',r.name),el('small',r.functionCount+' 功能'));b.onclick=()=>loadRole(r.id);box.append(b)}}
function showViews(){const project=selectedRole===null;$('projectView').hidden=!project;$('modebar').hidden=project;$('flowView').hidden=project||mode!=='flow';$('overviewView').hidden=project||mode!=='overview';$('documents').hidden=project;$('flowTab').classList.toggle('active',mode==='flow');$('overviewTab').classList.toggle('active',mode==='overview')}
function projectOverview(){halt();clearTimeout(pollTimer);loadingVersion++;selectedRole=null;graph=null;roleNav();showViews();$('title').textContent=index.roles.length+' 个角色，各自清晰。';$('description').textContent='按角色边界浏览功能。选择一个角色进入总览或逐步演示。';$('breadcrumb').textContent=index.project+' / 项目角色总览';$('stats').textContent=index.roles.reduce((n,r)=>n+r.functionCount,0)+' 个已编排功能';setNotice('');$('projectView').replaceChildren();for(const r of index.roles){const b=el('button',undefined,'rolecard');b.append(el('strong',r.name),el('p',r.description),el('small',r.functionCount+' 个功能 · '+r.nodeCount+' 个角色/直接依赖节点 →'));b.onclick=()=>loadRole(r.id);$('projectView').append(b)}}
async function loadRole(id){halt();clearTimeout(pollTimer);const version=++loadingVersion;selectedRole=id;position=-1;functionIndex=0;scenarioIndex=0;roleNav();try{const value=await api('/api/role-atlas?role='+encodeURIComponent(id));if(version!==loadingVersion)return;graph=value;connectionLost=false;$('title').textContent=graph.role.name+' · 功能图谱';$('description').textContent=graph.role.description;$('breadcrumb').textContent=index.project+' / '+graph.role.name;$('stats').textContent=graph.nodes.length+' 个节点 · '+graph.functions.length+' 个功能';$('generated').textContent='快照 '+new Date(graph.generatedAt).toLocaleString('zh-CN');renderSelectors();renderOverview();renderDocuments();showViews();freshness();renderSteps();pollTimer=setTimeout(checkFreshness,5000)}catch(e){if(version===loadingVersion){graph=null;showViews();setNotice('无法读取角色图谱：'+e.message);$('flowGraph').replaceChildren(el('div','请先生成该角色图谱。','empty'));updateControls()}}}
function freshness(){const current=graph.freshness.current;$('freshness').textContent=current?'● 源码依据与快照一致':'● 依据已变化，演示已暂停';const alerts=[...(graph.warnings||[])];if(!current)alerts.unshift('源码、功能描述或演示定义已变化，请重新生成角色图谱再播放：'+graph.freshness.changed.join('、'));setNotice(alerts.join(' / '));if(!current)halt();updateControls()}
async function checkFreshness(){const id=selectedRole,version=loadingVersion;if(!id)return;try{const fresh=await api('/api/role-atlas?role='+encodeURIComponent(id));if(version!==loadingVersion)return;connectionLost=false;if(fresh.generatedAt!==graph.generatedAt){await loadRole(id);return}graph.freshness=fresh.freshness;freshness()}catch(e){if(version===loadingVersion){connectionLost=true;halt();setNotice('连接中断，演示暂停。当前显示旧快照：'+e.message);updateControls()}}if(version===loadingVersion)pollTimer=setTimeout(checkFreshness,5000)}
function renderSelectors(){const f=$('functionSelect');f.replaceChildren();graph.functions.forEach((item,i)=>{const o=el('option',item.name);o.value=i;f.append(o)});f.disabled=!graph.functions.length;const sc=$('scenarioSelect');sc.replaceChildren();const feature=graph.functions[functionIndex];(feature?.scenarios||[]).forEach((item,i)=>{const o=el('option',item.name);o.value=i;sc.append(o)});sc.disabled=!feature;f.value=functionIndex;sc.value=scenarioIndex;$('functionDescription').textContent=feature?.description||'尚无功能定义，可以先查看角色总览。'}
function renderSteps(){const sc=scenario(),box=$('flowGraph');box.replaceChildren();if(!sc){box.append(el('div','该角色尚未配置可演示功能。','empty'));$('state').replaceChildren();$('stepTitle').textContent='暂无演示';updateControls();return}const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='wires';box.append(svg);sc.steps.forEach((step,i)=>{const b=el('button',undefined,'stepnode'+(i===position?' active':i<position?' done':''));b.dataset.index=i;b.setAttribute('aria-label','第 '+(i+1)+' 步 '+step.title);b.onclick=()=>{if(!canPlay())return;halt();position=i;renderSteps()};const top=el('div');top.append(el('span',String(i+1).padStart(2,'0'),'stepnum'),el('span',labels[step.layer]||step.layer,'layer'));if(step.external)top.append(el('span','外部角色','external'));b.append(top,el('strong',step.title),el('code',step.symbol||step.file));box.append(b)});const step=sc.steps[position];$('stepTitle').textContent=step?step.title:'准备开始';$('stepDescription').textContent=step?step.description:'点击“下一步”开始。每步更新示例状态，并显示对应源码依据。';$('flowCaption').textContent='场景输入：'+text(sc.inputs||{})+' · '+sc.steps.length+' 步；可点击节点跳转。';const values=step?step.stateAfter:sc.initialState;$('state').replaceChildren();for(const [key,value]of Object.entries(values)){const item=el('div',undefined,'stateitem'+(step&&Object.hasOwn(step.set||{},key)?' changed':''));item.append(el('span',key),el('strong',value));$('state').append(item)}$('sourcePath').textContent=step?step.file+':'+step.line:'源码定位将在步骤开始后显示';$('quote').textContent=step?step.quote:'// 不执行项目代码，仅展示对应片段';$('warning').hidden=!step?.warning;$('warning').textContent=step?.warning||'';updateControls();requestAnimationFrame(drawWires)}
function drawWires(){const box=$('flowGraph'),svg=$('wires');if(!svg)return;svg.replaceChildren();const rect=box.getBoundingClientRect(),cards=[...box.querySelectorAll('.stepnode')];svg.setAttribute('viewBox',`0 0 ${box.clientWidth} ${box.clientHeight}`);const ns='http://www.w3.org/2000/svg';for(let i=0;i<cards.length-1;i++){const a=cards[i].getBoundingClientRect(),b=cards[i+1].getBoundingClientRect();let sx=a.right-rect.left,sy=a.top-rect.top+a.height/2,tx=b.left-rect.left,ty=b.top-rect.top+b.height/2;if(b.top>a.top+10){sx=a.left-rect.left+a.width/2;sy=a.bottom-rect.top;tx=b.left-rect.left+b.width/2;ty=b.top-rect.top}const line=document.createElementNS(ns,'path');line.setAttribute('d',`M${sx},${sy} C${sx+(tx-sx)*.5},${sy} ${sx+(tx-sx)*.5},${ty} ${tx},${ty}`);line.setAttribute('fill','none');line.setAttribute('stroke',i<position?'#27866b':'#b9ccba');line.setAttribute('stroke-width',i<position?'2':'1.2');line.setAttribute('stroke-dasharray',i<position?'':'4 4');svg.append(line);const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',tx);dot.setAttribute('cy',ty);dot.setAttribute('r','3');dot.setAttribute('fill',i<position?'#27866b':'#b9ccba');svg.append(dot)}}
function updateControls(){const sc=scenario(),count=sc?.steps.length||0,enabled=canPlay();$('previous').disabled=!enabled||position<0;$('next').disabled=!enabled||position>=count-1;$('reset').disabled=!sc;$('play').disabled=!enabled||position>=count-1;$('sourceButton').disabled=!sc||position<0;$('counter').textContent=String(position+1).padStart(2,'0')+' / '+String(count).padStart(2,'0');$('progress').style.width=(count?(position+1)/count*100:0)+'%'}
function next(){if(!canPlay())return;const sc=scenario();if(position<sc.steps.length-1){position++;renderSteps()}if(position>=sc.steps.length-1)halt()}
function renderOverview(){const box=$('fileGraph');box.replaceChildren();for(const key of ['interface','pipelines','services','providers','models']){const col=el('div',undefined,'layercol');col.append(el('h3',labels[key]));const rows=graph.nodes.filter(n=>n.layer===key||(key==='interface'&&n.layer==='support'));for(const node of rows){const b=el('button',undefined,'filenode'+(node.access==='external'?' externalfile':''));b.dataset.path=node.path;b.append(el('strong',node.name),el('small',node.path),el('small',(node.access==='external'?'外部依赖':node.access==='read-only'?'只读引用':'边界声明')+' · '+(node.owners.join(' / ')||'未明确主属主')));b.onclick=()=>fileDetails(node);col.append(b)}box.append(col)}$('fileInfo').textContent='点击文件查看直接引用与被引用关系。文件归属按现有边界声明展示，不代表已经通过架构合规审查。'}
function fileDetails(node){document.querySelectorAll('.filenode').forEach(b=>b.classList.toggle('selected',b.dataset.path===node.path));const box=$('fileInfo');box.replaceChildren(el('strong',node.path));for(const [title,filter,target] of [['它引用',e=>e.source===node.id,'target'],['被引用',e=>e.target===node.id,'source']]){const row=el('div',undefined,'relations');box.append(el('p',title+'（当前角色视图内）'));const edges=graph.edges.filter(filter);if(!edges.length)row.append(el('span','未提取到静态记录','small'));for(const edge of edges){const b=el('button',edge[target]+' · L'+edge.line,'relation');b.onclick=()=>fileDetails(graph.nodes.find(n=>n.id===edge[target]));row.append(b)}box.append(row)}const b=el('button','查看源码片段 ↗','btn');b.onclick=()=>source(node.path,1);box.append(b)}
function renderDocuments(){const box=$('docLinks');box.replaceChildren(el('span','功能描述依据'));if(!graph.role.documents.length)box.append(el('span','尚未发现功能描述文件','small'));for(const path of graph.role.documents){const b=el('button',path,'btn');b.onclick=()=>source(path,1);box.append(b)}}
async function source(file,line){$('dialogTitle').textContent=file+':'+line;$('dialogBody').textContent='读取中…';if(!$('sourceDialog').open)$('sourceDialog').showModal();try{const value=await api('/api/role-source?role='+encodeURIComponent(selectedRole)+'&file='+encodeURIComponent(file)+'&line='+line);$('dialogBody').textContent=(value.current?'':'[依据已变化]\n')+value.text}catch(e){$('dialogBody').textContent='读取失败：'+e.message}}
$('functionSelect').onchange=e=>{halt();functionIndex=+e.target.value;scenarioIndex=0;position=-1;renderSelectors();renderSteps()};$('scenarioSelect').onchange=e=>{halt();scenarioIndex=+e.target.value;position=-1;renderSteps()};$('next').onclick=()=>{halt();next()};$('previous').onclick=()=>{halt();position=Math.max(-1,position-1);renderSteps()};$('reset').onclick=()=>{halt();position=-1;renderSteps()};$('play').onclick=()=>{if(playTimer){halt();return}if(!canPlay())return;$('play').textContent='Ⅱ 暂停';playTimer=setInterval(next,+$('speed').value)};$('speed').onchange=()=>{if(playTimer){halt();$('play').click()}};$('flowTab').onclick=()=>{mode='flow';showViews();requestAnimationFrame(drawWires)};$('overviewTab').onclick=()=>{halt();mode='overview';showViews()};$('sourceButton').onclick=()=>{const step=scenario()?.steps[position];if(step)source(step.file,step.line)};$('closeDialog').onclick=()=>$('sourceDialog').close();document.addEventListener('visibilitychange',()=>{if(document.hidden)halt()});window.addEventListener('resize',drawWires);
(async()=>{try{index=await api('/api/role-atlas');if(!index.roles.length)throw Error('没有角色数据');const requested=new URLSearchParams(location.search).get('role');if(requested==='__all__'){projectOverview();return}const preferred=index.roles.find(r=>r.id===requested)||index.roles[0];await loadRole(preferred.id)}catch(e){setNotice('尚未接入角色图谱：'+e.message);$('description').textContent='先运行 role_atlas.py，指定项目与功能步骤定义。';updateControls()}})();
if(embedded){let lastHeight=0;new ResizeObserver(()=>{const height=Math.ceil(document.querySelector('.content').getBoundingClientRect().height);if(Math.abs(height-lastHeight)>1){lastHeight=height;window.parent.postMessage({type:'ans-role-atlas-height',height},location.origin);}}).observe(document.querySelector('.content'));window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===window.parent&&event.data?.type==='ans-role-atlas-pause')halt();});}
</script></body></html>
